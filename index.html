<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcade & MAME Catalog</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #00e676;
    }
    .search-box {
      width: 100%;
      max-width: 500px;
      margin: 0 auto 20px auto;
      display: block;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background-color: #1e1e1e;
      color: #fff;
      font-size: 16px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 16px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .card {
      background-color: #1e1e1e;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
      text-align: center;
    }
    .card:hover {
      transform: translateY(-4px);
      background-color: #2a2a2a;
    }
    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 4px;
      background-color: #000;
    }
    .card .title {
      margin-top: 10px;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.2;
    }
    #emulator-container {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000;
      z-index: 1000;
    }
    #back-btn {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1001;
      padding: 10px 16px;
      background-color: #ff5252;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>Arcade / MAME Arcade</h1>
  <input type="text" id="search" class="search-box" placeholder="Поиск игры...">

  <div class="grid" id="game-grid"></div>

  <div id="emulator-container">
    <button id="back-btn" onclick="closeEmulator()">← Назад к каталогу</button>
    <div id="emulator"></div>
  </div>

  <script>

      { title: "Minasan no Okage-sama desu", rom: "minasan.zip", core: "mame", cover: getCover("minasan") },

      { title: "Mutation Nation", rom: "mutnat.zip", core: "mame", cover: getCover("mutnat") },
      { title: "Ninja Combat", rom: "ncombat.zip", core: "mame", cover: getCover("ncombat") },
      { title: "Ninja Commando", rom: "ncommand.zip", core: "mame", cover: getCover("ncommand") },
      { title: "Nemo", rom: "nemo.zip", core: "mame", cover: getCover("nemo") },
      { title: "Neo Bomberman", rom: "neobombe.zip", core: "mame", cover: getCover("neobombe") },
      { title: "Neo Drift Out", rom: "neodrift.zip", core: "mame", cover: getCover("neodrift") },
      { title: "Neo Pong", rom: "neopong.zip", core: "mame", cover: getCover("neopong") },
      { title: "Ninja Master's", rom: "ninjamas.zip", core: "mame", cover: getCover("ninjamas") }
    ];

    const grid = document.getElementById('game-grid');
    const searchInput = document.getElementById('search');

    function renderGames(filter = '') {
      grid.innerHTML = '';
      const filtered = GAMES_LIST.filter(g => g.title.toLowerCase().includes(filter.toLowerCase()));
      
      filtered.forEach(game => {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => launchGame(game);
        
        card.innerHTML = `
          <img src="${game.cover}" alt="${game.title}" onerror="this.src='https://via.placeholder.com/160x180?text=No+Cover'">
          <div class="title">${game.title}</div>
        `;
        grid.appendChild(card);
      });
    }

    searchInput.addEventListener('input', (e) => renderGames(e.target.value));

    function launchGame(game) {
      document.getElementById('emulator-container').style.display = 'block';
      
      window.EJS_player = '#emulator';
      window.EJS_core = game.core;
      window.EJS_gameUrl = `roms/${game.rom}`; // Путь к папке с ромами
      window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
      
      const script = document.createElement('script');
      script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
      script.id = 'ejs-loader';
      document.body.appendChild(script);
    }

    function closeEmulator() {
      document.getElementById('emulator-container').style.display = 'none';
      document.getElementById('emulator').innerHTML = '';
      const loader = document.getElementById('ejs-loader');
      if (loader) loader.remove();
    }

    renderGames();
  </script>
</body>
</html>
